# =============================================================================
# Leegend Cars — Netlify (site statique)
# =============================================================================
# Netlify ne sert ici que des fichiers : le site public, le back-office et ses
# ressources. Les données, l'authentification, les fichiers et les documents
# vivent dans Supabase.
#
# Rien n'est compilé côté Netlify hormis le client Supabase : le fichier
# admin/index.html et admin/login.html sont générés par « npm run build » à
# partir de server/views.js, ce qui garantit que le back-office affiché est
# exactement celui que produit le serveur en local.

[build]
  publish = "."
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  NODE_ENV = "production"

# -----------------------------------------------------------------------------
# Adresses propres
# -----------------------------------------------------------------------------
# /admin et /admin/ servent la page du back-office ; /admin/login, la connexion.
[[redirects]]
  from = "/admin/login"
  to = "/admin/login.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/doc-assets/*"
  to = "/admin-assets/:splat"
  status = 200

# Le back-office n'est pas destiné aux moteurs de recherche.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# -----------------------------------------------------------------------------
# Mise en cache
# -----------------------------------------------------------------------------
# Le nom de fichier suffit : c'est ce qui permet de mettre un an de cache sur
# les images sans jamais servir une version périmée après un remplacement.
[[headers]]
  for = "/cars/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le back-office change souvent : pas de cache, et jamais d'indexation.
[[headers]]
  for = "/admin-assets/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/signature.html"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex, nofollow"
