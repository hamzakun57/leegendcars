# Déploiement Render (bout en bout)
# 1. Pousser ce fichier sur GitHub (il est déjà à la racine du dépôt).
# 2. Dans Render : New > Blueprint, choisir le dépôt, Render lit render.yaml.
# 3. Renseigner les 3 variables marquées `sync: false`.
# 4. Déployer. Le site répond sur https://leegend-cars.onrender.com

services:
  - type: web
    name: leegend-cars
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/vehicles
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24.20.0"
      # Derrière Render il faut écouter sur toutes les interfaces.
      - key: HOST
        value: "0.0.0.0"
      - key: NODE_ENV
        value: production
      # --- à copier depuis le dashboard Supabase ---
      # Supabase > Project Settings > Database > Connection string > URI
      # (mode Session pooler : fonctionne en IPv4)
      - key: DATABASE_URL
        sync: false
      # Supabase > Project Settings > API > Project URL
      - key: SUPABASE_URL
        sync: false
      # Supabase > Project Settings > API > service_role
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Généré automatiquement par Render au premier déploiement.
      # Noter la valeur affichée : c'est elle qui invalide les sessions.
      - key: SESSION_SECRET
        generateValue: true